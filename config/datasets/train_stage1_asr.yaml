# Paths are relative to the repository root and match README.md.
# Stage 1: ASR+TTS only. Every physical audio sample contains both asr.json and
# tts.json; task_policy=all expands it into one ASR and one TTS logical sample.
dataset_backend: webdataset_stream
num_mel_bins: 128

dataset:
  asr_tts:
    ratio: 1.0
    data_format: webdataset_stream
    data_paths:
      # Exclude train-00355 (only 1,024 samples versus 10,000 elsewhere).
      - data/training/asrtts_packed_webdataset/data/train-{00000..00354}-of-00356.tar
    webdataset:
      layout: shared_audio_tasks
      tasks: [asr]
      task_policy: all
      audio_extensions: [wav, flac, mp3, m4a, ogg]
      duplicate_member_policy: error

webdataset_runtime:
  sampling:
    # Distributed training requires resampled mode with a fixed step budget
    # from each recipe's webdataset_steps_per_epoch.
    mode: resampled
    seed: 42
    shuffle: true
  shuffle:
    max_samples: 4096
    initial_samples: 1024
    max_bytes: 2147483648
  bucketing:
    pool_samples: 2048
    pool_bytes: 1073741824
    chunk_size: 128
  batching:
    max_cost: 4000
    max_samples: 5
    min_samples: 1
    drop_last: false
    oversized_sample: drop
    decode_failure_policy: skip_and_refill
  errors:
    max_consecutive_errors: 100
