# Public VoiceBench, OpenAudioBench, and LibriSpeech scoring configuration.
# Run from the FlexiSLM repository root after generating the expected traces.
evalkit_path: Kimi-Audio-Evalkit
data_root: data/benchmarks
model_name: FlexiSLM-7B-Stage2-v1
voicebench_summary_path: outputs/evaluation/results/voicebench_summary.json
log_dir: logs/evaluation/benchmarks

judge_model: deepseek-chat
judge_api_base: https://api.deepseek.com/v1/chat/completions
judge_api_key_env: DEEPSEEK_API_KEY

evalkit_commit: 57547485d89d480b474ff0e9eb02652f34d0f139

jobs:
  - name: voicebench_mmsu
    benchmark: voicebench
    dataset: mmsu
    method: vb-mcq
    trace_file: outputs/evaluation/traces/mmsu/traces.jsonl
    result_path: outputs/evaluation/results/mmsu_performance.json

  - name: voicebench_openbookqa
    benchmark: voicebench
    dataset: openbookqa
    method: vb-mcq
    trace_file: outputs/evaluation/traces/openbookqa/traces.jsonl
    result_path: outputs/evaluation/results/openbookqa_performance.json

  - name: voicebench_sd-qa
    benchmark: voicebench
    dataset: sd-qa
    method: vb-qa
    trace_file: outputs/evaluation/traces/sd-qa/traces.jsonl
    result_path: outputs/evaluation/results/sd-qa_performance.json

  - name: voicebench_advbench
    benchmark: voicebench
    dataset: advbench
    method: vb-advbench
    trace_file: outputs/evaluation/traces/advbench/traces.jsonl
    result_path: outputs/evaluation/results/advbench_performance.json

  - name: voicebench_ifeval
    benchmark: voicebench
    dataset: ifeval
    method: default
    auxiliary_method: vb-ifeval
    include_prediction_text: false
    trace_file: outputs/evaluation/traces/ifeval/traces.jsonl
    result_path: outputs/evaluation/results/ifeval_performance.json

  - name: voicebench_alpacaeval_full
    benchmark: voicebench
    dataset: alpacaeval_full
    method: default
    trace_file: outputs/evaluation/traces/alpacaeval_full/traces.jsonl
    result_path: outputs/evaluation/results/alpacaeval_full_performance.json

  - name: voicebench_commoneval
    benchmark: voicebench
    dataset: commoneval
    method: default
    trace_file: outputs/evaluation/traces/commoneval/traces.jsonl
    result_path: outputs/evaluation/results/commoneval_performance.json

  - name: openaudiobench
    benchmark: openaudiobench
    dataset: OpenAudioBench
    method: default
    trace_file: outputs/evaluation/traces/OpenAudioBench/traces.jsonl
    result_path: outputs/evaluation/results/openaudiobench_performance.json

  - name: librispeech_test-clean
    benchmark: librispeech
    task: asr
    trace_file: outputs/evaluation/traces/librispeech/test-clean/traces.jsonl
    result_path: outputs/evaluation/results/librispeech_test-clean_wer.json

  - name: librispeech_test-other
    benchmark: librispeech
    task: asr
    trace_file: outputs/evaluation/traces/librispeech/test-other/traces.jsonl
    result_path: outputs/evaluation/results/librispeech_test-other_wer.json
