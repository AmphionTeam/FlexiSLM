# VoiceBench/OpenAudioBench audio-QA and LibriSpeech ASR inference manifest.
# Run with: bash scripts/infer_benchmarks.sh
#
# Decoded audio sample rates: flow-matching Vocos = 24 kHz (default);
# FlexiCodec AR decode = 16 kHz. ASR/audio-QA tasks use output_text_only
# (no waveform decode); keep use_flow_matching_decoder=true so enabling
# audio decode for other tasks stays correct.
x-engine: &engine
  engine:
    config:
      model_path: ${MODEL_ROOT}/FlexiSLM-7B-Stage2
      qwen25o_encoder_path: ${MODEL_ROOT}/Qwen2_5-Omni-Audio_Encoder
      qwen25o_encoder_config_path: ${MODEL_ROOT}/Qwen2_5-Omni-Audio_Encoder/config.json
      flexicodec_ckpt_path: ${MODEL_ROOT}/FlexiCodec/nartts_flexicodec_only.safetensors
      flexicodec_config_path: ${MODEL_ROOT}/FlexiCodec/12hz_v1_half_config.yaml
      sensevoice_path: ${MODEL_ROOT}/SenseVoiceSmall
      use_flow_matching_decoder: true
      flow_matching_ckpt_path: ${MODEL_ROOT}/FlexiCodec/nartts.safetensors
      flow_matching_vocoder_path: ${MODEL_ROOT}/FlexiCodec/vocos_emilia.safetensors
      flow_matching_prompt_audio_path: ${REPO_ROOT}/examples/input.wav
      enable_flexible_framerate: true
      default_input_framerate: 8.0
      default_output_framerate: 8.0
      framerate_min: 1.0
      framerate_max: 100.0
      output_sample_rate: 24000
      torch_dtype: bfloat16
      attn_implementation: flash_attention_2
  inference: &inference
    checkpoint: ${MODEL_ROOT}/FlexiSLM-7B-Stage2
    target_framerate_hz: 8.0
    output_sample_rate: 24000
  runtime: &runtime
    devices: [cuda:0]
    fail_fast: false

jobs:
  - name: mmsu
    config:
      <<: *engine
      input:
        path: ${REPO_ROOT}/outputs/evaluation/requests/voicebench/mmsu_requests.jsonl
      output:
        trace_path: ${REPO_ROOT}/outputs/evaluation/traces/mmsu/traces.jsonl
        error_path: ${LOG_ROOT}/mmsu/errors.jsonl
      inference: *inference
      runtime: *runtime

  - name: openbookqa
    config:
      <<: *engine
      input:
        path: ${REPO_ROOT}/outputs/evaluation/requests/voicebench/openbookqa_requests.jsonl
