# Stage 2 (7B): initialize from Stage 1, train the Talker and input modules in full,
# and adapt the Qwen Thinker with LoRA. Paths are relative to the repository root.

# Model
model_name_or_path: models/Qwen2.5-7B-Instruct
config_name: models/Qwen2.5-7B-Instruct
tokenizer_name: models/Qwen2.5-7B-Instruct
use_joint_text_audio_vocab: false
# Stage 2 trains the Thinker through LoRA while keeping the base Qwen weights frozen.
# The Talker and v2 input/frame merging transformer remain fully trainable.
freeze_llm: false
freeze_talker: false
only_train_talker: false
only_train_modules: "input_merging_transformer,talker_model,llm_lora"
# Continue training the Stage 1 v2 frame merger instead of reinitializing it.
reinitialize_input_merging_transformer: false

# Audio encoder and codec
use_sensevoice_feature: false
use_qwen25omni_feature: true
qwen25omni_encoder_path: models/Qwen2_5-Omni-Audio_Encoder
qwen25omni_encoder_config_path: models/Qwen2_5-Omni-Audio_Encoder/config.json
flexicodec_config_path: models/FlexiCodec/12hz_v1_half_config.yaml
flexicodec_ckpt_path: models/FlexiCodec/nartts_flexicodec_only.safetensors
sensevoice_small_path: models/SenseVoiceSmall
finetune_speech_encoder: false
enable_flexible_framerate: true
training_framerate_options: "0.86,0.87,0.88,0.90,0.91,1.0,1.0"
training_input_framerate_options: "5.0,5.5,6.0,6.5,7.0,7.5,8.0,8.5,9.0,9.5,10.0,11.0,12.0,12.5"
framerate_min: 0.0
framerate_max: 1.0
use_sinusoidal: true
per_sample_frame_rate_embed: true

# Talker and input modules
early_diverge_talker: false
talker_concat_lm_text_output: true
talker_hidden_size: 1280
talker_num_layers: 20
length_loss_weight: 0.1
talker_num_attention_heads: 8
talker_intermediate_size: 5120
talker_checkpoint_path: ""
text_loss_weight: 2.0
use_mlp_for_audio_embed: true
use_omni_token: true
no_pad: true
use_combined_embedding: false
force_use_combined_embedding: false
use_input_merging_transformer: true
use_input_merging_transformer_v2: true
input_merging_transformer_d_model: 768
use_learnable_audio_boundary: true

# LoRA and component-specific learning rates
use_lora: true
lora_rank: 32
lora_alpha: 64
talker_learning_rate: 1.0e-4

# Data and Stage 1 initialization (Hub id downloads into models/ on first use)
dataset_name: config/datasets/train_stage2_3.yaml
checkpoint_load_mode: weights_only
resume_from_checkpoint: FlexiSLM/FlexiSLM-7B-Stage1

# Training
do_train: true
output_dir: outputs/train_stage2_7B
run_name: train_stage2_7B
num_train_epochs: 2
per_device_train_batch_size: 16
max_tokens_per_batch: 4000
# ceil(~5,865,000 logical samples / (8 GPUs * 16 samples per GPU))
webdataset_steps_per_epoch: 45821
gradient_accumulation_steps: 2
auto_find_batch_size: false
save_strategy: steps
save_steps: 15000
save_total_limit: 10
max_grad_norm: 1.0
learning_rate: 2.0e-5
weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-8
warmup_ratio: 0.005
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs: {min_lr: 2.0e-6}
logging_steps: 10
log_level: info
model_max_length: 1024
gradient_checkpointing: false
ddp_timeout: 7200
dataloader_num_workers: 8
dataloader_pin_memory: true
bf16: true
fp16: false
report_to: swanlab
torch_dtype: bfloat16
trust_remote_code: true
attn_implementation: flash_attention_2
seed: 42
data_seed: 42
