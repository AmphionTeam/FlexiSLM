# Stage 3: full fine-tuning with the v2 input merging transformer.
# Keys map directly to the dataclass arguments in src/arguments.py.

# Model
model_name_or_path: Qwen/Qwen2.5-7B-Instruct
config_name: Qwen/Qwen2.5-7B-Instruct
tokenizer_name: Qwen/Qwen2.5-7B-Instruct
use_joint_text_audio_vocab: false
freeze_llm: false
only_train_talker: false

# Audio encoder and frame-rate control
use_sensevoice_feature: false
use_qwen25omni_feature: true
qwen25omni_encoder_path: path/to/Qwen2.5-Omni-7B
qwen25omni_encoder_config_path: path/to/Qwen2.5-Omni-7B/config.json
finetune_speech_encoder: false
enable_flexible_framerate: true
training_framerate_options: "0.86,0.87,0.88,0.90,0.91,1.0,1.0"
training_input_framerate_options: "5.0,5.5,6.0,6.5,7.0,7.5,8.0,8.5,9.0,9.5,10.0,11.0,12.0,12.5"
framerate_min: 0.0
framerate_max: 1.0
use_sinusoidal: true
per_sample_frame_rate_embed: true

# Talker and embeddings
early_diverge_talker: false
talker_concat_lm_text_output: true
talker_hidden_size: 1024
talker_num_layers: 20
text_loss_weight: 2.0
use_omni_token: true
no_pad: false
force_use_combined_embedding: true
use_input_merging_transformer: true
use_input_merging_transformer_v2: true
input_merging_transformer_d_model: 768
use_learnable_audio_boundary: true
extend_lm_head: false

# Full fine-tuning and component-specific learning rates
use_lora: false
lora_rank: 32
lora_alpha: 64
talker_learning_rate: 2.0e-4
combine_proj_learning_rate: 2.0e-5

# Data
dataset_name: config/datasets/train_stage2_3.yaml
dataset_name_eval: config/datasets/eval.yaml
max_eval_samples: 5000

# Training
do_train: true
do_eval: true
output_dir: outputs/train_stage3
run_name: train_stage3
num_train_epochs: 1
per_device_train_batch_size: 2
max_tokens_per_batch: 2200
per_device_eval_batch_size: 4
gradient_accumulation_steps: 1
auto_find_batch_size: false
eval_strategy: steps
eval_steps: 5000
eval_accumulation_steps: 1
bf16_full_eval: true
save_strategy: steps
save_steps: 5000
save_total_limit: 120
max_grad_norm: 1.0
learning_rate: 1.0e-6
weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-8
warmup_ratio: 0.05
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs: '{"min_lr": 1e-7}'
logging_steps: 100
log_level: info
model_max_length: 1024
gradient_checkpointing: false
ddp_timeout: 7200
dataloader_num_workers: 4
dataloader_pin_memory: true
bf16: true
fp16: false
report_to: swanlab
torch_dtype: bfloat16
trust_remote_code: true
attn_implementation: flash_attention_2
seed: 42
data_seed: 42
